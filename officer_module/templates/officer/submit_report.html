{% extends 'officer/base.html' %}

{% block title %}Submit Report - FLAME Guard Officer{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
    <h1 class="h2"><i class="bi bi-file-text"></i> Submit Report</h1>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="title" class="form-label">Report Title *</label>
                        <input type="text" class="form-control" id="title" name="title"
                            placeholder="e.g., Daily Patrol Report" required>
                    </div>
                    <div class="mb-3">
                        <label for="content" class="form-label">Report Content *</label>
                        <textarea class="form-control" id="content" name="content" rows="10"
                            placeholder="Describe your observations, incidents, or activities..." required></textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> Submit Report
                        </button>
                        <a href="{% url 'officer_dashboard' %}" class="btn btn-secondary">
                            <i class="bi bi-x-circle"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
