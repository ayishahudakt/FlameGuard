{% extends 'officer/base.html' %}
{% block title %}Add Preserved Animal - Officer Panel{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold" style="color:#1e40af;"><i class="bi bi-plus-circle-fill me-2"></i> Add Preserved Animal</h2>
    <a href="{% url 'officer_manage_preserved_animals' %}" class="btn btn-outline-secondary rounded-pill px-4">
        <i class="bi bi-arrow-left me-1"></i> Back
    </a>
</div>

<div class="card shadow-sm border-0" style="border-radius:16px; max-width:640px;">
    <div class="card-body px-4 py-4">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold">Animal <span class="text-danger">*</span></label>
                <select name="animal" class="form-select" style="border-radius:10px;" required>
                    <option value="">-- Select Animal --</option>
                    {% for animal in animals %}
                    <option value="{{ animal.pk }}">{{ animal.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Preservation Status</label>
                <select name="preservation_status" class="form-select" style="border-radius:10px;">
                    <option value="ENDANGERED">Endangered</option>
                    <option value="VULNERABLE">Vulnerable</option>
                    <option value="NEAR_THREATENED">Near Threatened</option>
                    <option value="LEAST_CONCERN">Least Concern</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Threat Level</label>
                <select name="threat_level" class="form-select" style="border-radius:10px;">
                    <option value="LOW">Low</option>
                    <option value="MEDIUM">Medium</option>
                    <option value="HIGH">High</option>
                    <option value="CRITICAL">Critical</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Population Estimate</label>
                <input type="number" name="population_estimate" class="form-control" style="border-radius:10px;"
                    min="0">
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Conservation Notes</label>
                <textarea name="conservation_notes" class="form-control" rows="3"
                    style="border-radius:10px;"></textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary rounded-pill px-4">
                    <i class="bi bi-check-lg me-1"></i> Save Entry
                </button>
                <a href="{% url 'officer_manage_preserved_animals' %}"
                    class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
