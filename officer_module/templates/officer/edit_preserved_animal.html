{% extends 'officer/base.html' %}
{% block title %}Edit Preserved Animal - Officer Panel{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold" style="color:#1e40af;"><i class="bi bi-pencil-square me-2 text-warning"></i> Edit Preserved Animal</h2>
    <a href="{% url 'officer_manage_preserved_animals' %}" class="btn btn-outline-secondary rounded-pill px-4">
        <i class="bi bi-arrow-left me-1"></i> Back
    </a>
</div>

<div class="card shadow-sm border-0" style="border-radius:16px; max-width:640px;">
    <div class="card-body px-4 py-4">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold">Animal <span class="text-danger">*</span></label>
                <select name="animal" class="form-select" style="border-radius:10px;" required>
                    {% for animal in animals %}
                    <option value="{{ animal.pk }}" {% if preserved.animal.pk == animal.pk %}selected{% endif %}>{{ animal.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Preservation Status</label>
                <select name="preservation_status" class="form-select" style="border-radius:10px;">
                    <option value="ENDANGERED" {% if preserved.preservation_status == 'ENDANGERED' %}selected{% endif %}>Endangered</option>
                    <option value="VULNERABLE" {% if preserved.preservation_status == 'VULNERABLE' %}selected{% endif %}>Vulnerable</option>
                    <option value="CRITICALLY_ENDANGERED" {% if preserved.preservation_status == 'CRITICALLY_ENDANGERED' %}selected{% endif %}>Critically Endangered</option>
                    <option value="PROTECTED" {% if preserved.preservation_status == 'PROTECTED' %}selected{% endif %}>Protected</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Threat Level</label>
                <select name="threat_level" class="form-select" style="border-radius:10px;">
                    <option value="LOW" {% if preserved.threat_level == 'LOW' %}selected{% endif %}>Low</option>
                    <option value="MEDIUM" {% if preserved.threat_level == 'MEDIUM' %}selected{% endif %}>Medium</option>
                    <option value="HIGH" {% if preserved.threat_level == 'HIGH' %}selected{% endif %}>High</option>
                    <option value="CRITICAL" {% if preserved.threat_level == 'CRITICAL' %}selected{% endif %}>Critical</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Population Estimate</label>
                <input type="number" name="population_estimate" class="form-control" style="border-radius:10px;" value="{{ preserved.population_estimate|default:'' }}" min="0">
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Conservation Notes</label>
                <textarea name="conservation_notes" class="form-control" rows="3" style="border-radius:10px;">{{ preserved.conservation_notes }}</textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-warning rounded-pill px-4 fw-bold">
                    <i class="bi bi-save me-1"></i> Update Entry
                </button>
                <a href="{% url 'officer_manage_preserved_animals' %}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
