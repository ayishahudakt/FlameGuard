{% extends 'officer/base.html' %}
{% block title %}Edit Animal - Officer Panel{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold" style="color:#1e40af;"><i class="bi bi-pencil-square me-2 text-warning"></i> Edit Animal</h2>
    <a href="{% url 'officer_manage_animals' %}" class="btn btn-outline-secondary rounded-pill px-4">
        <i class="bi bi-arrow-left me-1"></i> Back
    </a>
</div>

<div class="card shadow-sm border-0" style="border-radius:16px; max-width:640px;">
    <div class="card-body px-4 py-4">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold">Animal Name <span class="text-danger">*</span></label>
                <input type="text" name="name" class="form-control" style="border-radius:10px;"
                    value="{{ animal.name }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Scientific Name <span class="text-danger">*</span></label>
                <input type="text" name="scientific_name" class="form-control" style="border-radius:10px;"
                    value="{{ animal.scientific_name|default:'' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Description</label>
                <textarea name="description" class="form-control" rows="4"
                    style="border-radius:10px;">{{ animal.description }}</textarea>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Image (leave blank to keep current)</label>
                {% if animal.image %}
                <div class="mb-2">
                    <img src="{{ animal.image.url }}" height="100" style="border-radius:8px;" alt="Current">
                </div>
                {% endif %}
                <input type="file" name="image" class="form-control" accept="image/*" style="border-radius:10px;">
            </div>
            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" name="is_dangerous" id="isDangerous" {% if animal.is_dangerous %}checked{% endif %}>
                <label class="form-check-label fw-semibold" for="isDangerous">Mark as Dangerous</label>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-warning rounded-pill px-4 fw-bold">
                    <i class="bi bi-save me-1"></i> Update Animal
                </button>
                <a href="{% url 'officer_manage_animals' %}"
                    class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
