{% extends 'officer/base.html' %}

{% block title %}Send User Alert - FLAME Guard Officer{% endblock %}

{% block extra_css %}
<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto:wght@300;400;500&display=swap"
    rel="stylesheet">

<style>
    /* Modern Color Palette */
    :root {
        --gradient-primary: linear-gradient(135deg, #1e40af 0%, #7c3aed 100%);
        --gradient-send: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
        --gradient-secondary: linear-gradient(135deg, #64748b 0%, #475569 100%);
        --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.1);
        --shadow-hover: 0 12px 48px rgba(0, 0, 0, 0.15);
    }

    /* Modern Typography */
    body {
        font-family: 'Roboto', sans-serif;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
        font-family: 'Inter', sans-serif;
        font-weight: 700;
    }

    /* Page Animation */
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .page-container {
        animation: fadeInUp 0.6s ease-out;
    }

    /* Gradient Header */
    .page-header {
        background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        font-size: 2rem;
        font-weight: 800;
        margin-bottom: 2rem;
        animation: fadeInUp 0.8s ease-out;
    }

    .page-header i {
        -webkit-text-fill-color: #3b82f6;
    }

    /* Glassmorphism Form Card */
    .modern-form-card {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.85) 100%);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 20px;
        box-shadow: var(--shadow-soft);
        overflow: hidden;
        transition: all 0.3s ease;
        animation: fadeInUp 0.9s ease-out;
        padding: 2.5rem;
    }

    .modern-form-card:hover {
        box-shadow: var(--shadow-hover);
    }

    /* Modern Form Elements */
    .modern-label {
        color: #1e293b;
        font-weight: 600;
        font-size: 0.95rem;
        margin-bottom: 0.5rem;
        font-family: 'Inter', sans-serif;
    }

    .modern-input,
    .modern-select,
    .modern-textarea {
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        padding: 0.875rem 1.25rem;
        font-size: 0.95rem;
        transition: all 0.3s ease;
        background: rgba(248, 250, 252, 0.5);
    }

    .modern-input:focus,
    .modern-select:focus,
    .modern-textarea:focus {
        border-color: #7c3aed;
        box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1);
        background: #ffffff;
        outline: none;
    }

    .modern-textarea {
        resize: vertical;
        min-height: 120px;
    }

    /* Modern Buttons */
    .modern-btn {
        border-radius: 12px;
        padding: 0.875rem 2rem;
        font-weight: 600;
        font-size: 0.95rem;
        transition: all 0.3s ease;
        border: none;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-family: 'Inter', sans-serif;
    }

    .modern-btn i {
        font-size: 1.1rem;
    }

    .modern-btn-send {
        background: var(--gradient-send);
        color: white;
    }

    .modern-btn-send:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
        color: white;
    }

    .modern-btn-secondary {
        background: var(--gradient-secondary);
        color: white;
    }

    .modern-btn-secondary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(100, 116, 139, 0.3);
        color: white;
    }

    /* Button Group */
    .button-group {
        display: flex;
        gap: 1rem;
        margin-top: 2rem;
    }

    /* Responsive */
    @media (max-width: 768px) {
        .page-header {
            font-size: 1.5rem;
        }

        .modern-form-card {
            padding: 1.5rem;
        }

        .button-group {
            flex-direction: column;
        }

        .modern-btn {
            width: 100%;
            justify-content: center;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="page-container">
    <!-- Header -->
    <h1 class="page-header">
        <i class="bi bi-megaphone"></i> Send Alert to Public Users
    </h1>

    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
            <div class="modern-form-card">
                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="alert_type" class="modern-label">
                            Alert Type <span style="color: #ef4444;">*</span>
                        </label>
                        <select class="form-select modern-select" id="alert_type" name="alert_type" required>
                            <option value="INFO">Information</option>
                            <option value="WARNING">Warning</option>
                            <option value="DANGER">Danger</option>
                            <option value="CLOSURE">Area Closure</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="title" class="modern-label">
                            Alert Title <span style="color: #ef4444;">*</span>
                        </label>
                        <input type="text" class="form-control modern-input" id="title" name="title"
                            placeholder="e.g., Tiger Spotted in Area" required>
                    </div>

                    <div class="mb-3">
                        <label for="location" class="modern-label">Location</label>
                        <input type="text" class="form-control modern-input" id="location" name="location"
                            placeholder="e.g., Near Begur Watchtower">
                    </div>

                    <div class="mb-3">
                        <label for="message" class="modern-label">
                            Message <span style="color: #ef4444;">*</span>
                        </label>
                        <textarea class="form-control modern-textarea" id="message" name="message" rows="5"
                            placeholder="Provide details about the alert..." required></textarea>
                    </div>

                    <div class="button-group">
                        <button type="submit" class="btn modern-btn modern-btn-send">
                            <i class="bi bi-send-fill"></i>
                            Send Alert
                        </button>
                        <a href="{% url 'officer_dashboard' %}" class="btn modern-btn modern-btn-secondary">
                            <i class="bi bi-x-circle"></i>
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
