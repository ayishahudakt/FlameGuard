{% extends 'officer/base.html' %}

{% block title %}Send User Alert - FLAME Guard Officer{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
    <h1 class="h2"><i class="bi bi-megaphone"></i> Send Alert to Public Users</h1>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="alert_type" class="form-label">Alert Type *</label>
                        <select class="form-select" id="alert_type" name="alert_type" required>
                            <option value="INFO">Information</option>
                            <option value="WARNING">Warning</option>
                            <option value="DANGER">Danger</option>
                            <option value="CLOSURE">Area Closure</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="title" class="form-label">Alert Title *</label>
                        <input type="text" class="form-control" id="title" name="title"
                            placeholder="e.g., Tiger Spotted in Area" required>
                    </div>
                    <div class="mb-3">
                        <label for="location" class="form-label">Location</label>
                        <input type="text" class="form-control" id="location" name="location"
                            placeholder="e.g., Near Begur Watchtower">
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">Message *</label>
                        <textarea class="form-control" id="message" name="message" rows="5"
                            placeholder="Provide details about the alert..." required></textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-send"></i> Send Alert
                        </button>
                        <a href="{% url 'officer_dashboard' %}" class="btn btn-secondary">
                            <i class="bi bi-x-circle"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
