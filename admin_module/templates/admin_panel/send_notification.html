{% extends 'admin_panel/base.html' %}

{% block title %}Send Notification - FLAME Guard Admin{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-3 mb-4 border-bottom">
    <h1 class="h2">Dispatch Notification</h1>
    <a href="{% url 'view_sent_notifications' %}" class="btn btn-outline-primary d-flex align-items-center">
        <i data-feather="clock" class="me-2" style="width: 16px;"></i> View Dispatch History
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-xl-6 col-lg-8">
        <div class="card border-0 shadow-sm overflow-hidden" style="border-radius: 20px;">
            <div class="card-header bg-primary-bg border-0 py-4 px-4">
                <div class="d-flex align-items-center">
                    <div class="stat-icon primary me-3 mb-0" style="width: 48px; height: 48px; font-size: 1.25rem;">
                        <i data-feather="send"></i>
                    </div>
                    <div>
                        <h4 class="fw-bold mb-0 text-primary-main">Send Alert</h4>
                        <p class="text-muted small mb-0">Direct message to officer's dashboard</p>
                    </div>
                </div>
            </div>

            <div class="card-body p-4 p-md-5">
                <form method="post" class="needs-validation">
                    {% csrf_token %}

                    <div class="mb-4">
                        <label for="officer" class="form-label fw-bold text-dark small">Select Recipient Officer</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i data-feather="user"
                                    style="width: 16px;"></i></span>
                            <select class="form-select border-0 bg-light" id="officer" name="officer" required>
                                <option value="" selected disabled>Choose an officer...</option>
                                {% for officer in officers %}
                                <option value="{{ officer.pk }}">{{ officer.username }} ({{ officer.email }})</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="title" class="form-label fw-bold text-dark small">Notification Subject</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i data-feather="type"
                                    style="width: 16px;"></i></span>
                            <input type="text" class="form-control border-0 bg-light" id="title" name="title"
                                placeholder="e.g., Immediate Patrol Required" required>
                        </div>
                    </div>

                    <div class="mb-5">
                        <label for="message" class="form-label fw-bold text-dark small">Detailed Message Content</label>
                        <textarea class="form-control border-0 bg-light" id="message" name="message" rows="5"
                            placeholder="Enter the full notification details here..." required></textarea>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-8">
                            <button type="submit"
                                class="btn btn-primary w-100 py-3 d-flex align-items-center justify-content-center shadow-sm">
                                <i data-feather="send" class="me-2" style="width: 18px;"></i> Notification
                            </button>
                        </div>
                        <div class="col-md-4">
                            <a href="{% url 'admin_dashboard' %}" class="btn btn-light w-100 py-3 text-muted">
                                Cancel
                            </a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
         <!--
        <div class="alert bg-primary-bg mt-4 border-0 d-flex align-items-start p-4" style="border-radius: 16px;">
            <i data-feather="info" class="text-primary-main me-3 mt-1" style="min-width: 20px;"></i>
            <div class="small">
                <p class="fw-bold text-primary-main mb-1">Broadcast Best Practices</p>
                <p class="text-muted mb-0">Use clear subjects and action-oriented messages. Notifications are delivered
                    to officers' mobile apps and web portals instantly.</p>
            </div>
        </div>
        -->
    </div>
</div>

<style>
    .bg-primary-bg {
        background-color: var(--primary-bg) !important;
    }

    .form-select,
    .form-control {
        padding: 0.75rem 1rem;
        border-radius: 10px;
    }

    .input-group-text {
        border-radius: 10px 0 0 10px;
    }

    .form-select {
        border-radius: 10px;
    }

    .input-group>.form-select,
    .input-group>.form-control {
        border-radius: 0 10px 10px 0;
    }

    .btn-primary {
        font-weight: 600;
        border-radius: 12px;
    }
</style>
{% endblock %}
