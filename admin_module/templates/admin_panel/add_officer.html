{% extends 'admin_panel/base.html' %}

{% block title %}Add Forest Officer - FLAME Guard Admin{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
    <h1 class="h2"><i class="bi bi-plus-circle"></i> Add Forest Officer</h1>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">Account Information</div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="username" class="form-label">Username *</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email *</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password *</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="mb-3">
                        <label for="phone_number" class="form-label">Phone Number</label>
                        <input type="text" class="form-control" id="phone_number" name="phone_number">
                    </div>
                    <hr>
                    <h6>Officer Details</h6>
                    <div class="mb-3">
                        <label for="designation" class="form-label">Designation *</label>
                        <input type="text" class="form-control" id="designation" name="designation"
                            placeholder="e.g., Range Officer" required>
                    </div>
                    <div class="mb-3">
                        <label for="badge_number" class="form-label">Badge Number</label>
                        <input type="text" class="form-control" id="badge_number" name="badge_number">
                    </div>
                    <div class="mb-3">
                        <label for="station" class="form-label">Assign to Station (Optional)</label>
                        <select class="form-select" id="station" name="station">
                            <option value="">Not Assigned</option>
                            {% for station in stations %}
                            <option value="{{ station.pk }}">{{ station.name }} ({{ station.division.name }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> Create Officer
                        </button>
                        <a href="{% url 'manage_officers' %}" class="btn btn-secondary">
                            <i class="bi bi-x-circle"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
