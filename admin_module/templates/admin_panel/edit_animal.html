{% extends 'admin_panel/base.html' %}

{% block title %}Edit Animal - FLAME Guard Admin{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
    <h1 class="h2"><i class="bi bi-pencil"></i> Edit Animal</h1>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="name" class="form-label">Animal Name *</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ animal.name }}"
                            required>
                    </div>
                    <div class="mb-3">
                        <label for="scientific_name" class="form-label">Scientific Name</label>
                        <input type="text" class="form-control" id="scientific_name" name="scientific_name"
                            value="{{ animal.scientific_name }}">
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description *</label>
                        <textarea class="form-control" id="description" name="description" rows="4"
                            required>{{ animal.description }}</textarea>
                    </div>
                    {% if animal.image %}
                    <div class="mb-3">
                        <label class="form-label">Current Image</label>
                        <div>
                            <img src="{{ animal.image.url }}" alt="{{ animal.name }}" style="max-width: 200px;"
                                class="img-thumbnail">
                        </div>
                    </div>
                    {% endif %}
                    <div class="mb-3">
                        <label for="image" class="form-label">Change Image</label>
                        <input type="file" class="form-control" id="image" name="image" accept="image/*">
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="is_dangerous" name="is_dangerous" {% if
                            animal.is_dangerous %}checked{% endif %}>
                        <label class="form-check-label" for="is_dangerous">
                            Mark as Dangerous
                        </label>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> Update Animal
                        </button>
                        <a href="{% url 'manage_animals' %}" class="btn btn-secondary">
                            <i class="bi bi-x-circle"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
