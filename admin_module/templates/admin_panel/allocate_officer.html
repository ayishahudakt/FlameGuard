{% extends 'admin_panel/base.html' %}

{% block title %}Allocate Officer - FLAME Guard Admin{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
    <h1 class="h2"><i class="bi bi-geo-alt"></i> Allocate Officer to Station</h1>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <div class="mb-3">
                    <h5>Officer: {{ officer.user.username }}</h5>
                    <p class="text-muted">{{ officer.designation }}</p>
                </div>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="station" class="form-label">Select Station *</label>
                        <select class="form-select" id="station" name="station" required>
                            <option value="">Choose a station</option>
                            {% for station in stations %}
                            <option value="{{ station.pk }}" {% if officer.station and officer.station.pk==station.pk
                                %}selected{% endif %}>
                                {{ station.name }} ({{ station.division.name }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> Allocate
                        </button>
                        <a href="{% url 'manage_officers' %}" class="btn btn-secondary">
                            <i class="bi bi-x-circle"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
